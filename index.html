    <!-- Canonical host redirect: send published *.lovable.app mirrors to www.carnivalglamhub.com.
         Runs before any other script so visitors never see the mirror. Excludes the
         Lovable editor preview host (id-preview--*.lovable.app), localhost, and the
         real domain. -->
    <script>
      (function () {
        try {
          var h = window.location.hostname;
          if (
            h.endsWith(".lovable.app") &&
            !h.startsWith("id-preview--")
          ) {
            var target =
              "https://www.carnivalglamhub.com" +
              window.location.pathname +
              window.location.search +
              window.location.hash;
            window.location.replace(target);
          }
        } catch (e) {}
      })();
    </script>
